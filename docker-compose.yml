version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retropass
      POSTGRES_DB: retroboard
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./packages/backend
    environment:
      DATABASE_URL: postgres://retro:retropass@db:5432/retroboard
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./packages/frontend
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
