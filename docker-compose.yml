version: '3.9'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retropass
      POSTGRES_DB: retroboard
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./packages/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      DATABASE_URL: postgres://retro:retropass@db:5432/retroboard
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./packages/frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
